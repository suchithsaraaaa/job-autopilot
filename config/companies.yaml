# THE LEGITIMACY ALLOWLIST. Only companies listed here are ever searched, and
# each is fetched from its own Greenhouse / Lever / Ashby board, never from an
# aggregator, so there are no anonymous "consultancy" or agency postings.
#
# Add a company: find its careers page; if the URL is
#   boards.greenhouse.io/<slug> or job-boards.greenhouse.io/<slug>  -> ats: greenhouse
#   jobs.lever.co/<slug>                                          -> ats: lever
#   jobs.ashbyhq.com/<slug>                                       -> ats: ashby
# then run:  python -m jobautopilot check-companies
# to confirm every slug resolves (a wrong slug is skipped, never fatal).
# Optional `domains:` lists the company's own careers domain if its links leave the ATS.
companies:
  # India-based / India-hiring
  - {name: Razorpay,      ats: greenhouse, slug: razorpaysoftwareprivatelimited}
  # - {name: Postman,     ats: workday,    slug: postman}    # Disabled: Postman uses Workday, which does not provide a public board feed
  - {name: CRED,          ats: lever,      slug: cred}
  - {name: Meesho,        ats: lever,      slug: meesho}
  - {name: Groww,         ats: greenhouse, slug: groww}
  # - {name: PhonePe,     ats: smartrecruiters, slug: phonepe} # Disabled: PhonePe uses SmartRecruiters
  - {name: Sarvam AI,     ats: ashby,      slug: sarvam}
