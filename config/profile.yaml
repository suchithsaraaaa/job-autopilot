# What you are looking for. Edit freely.

# Regexes matched against the job TITLE. A job must match `include` and not `exclude`.
titles:
  include:
    - '\b(ai|ml|machine learning|llm|nlp|data|rag|genai|generative ai|research)\b.*\b(engineer|developer|scientist)\b'
    - '\b(python|django|flask|backend|back-end|full[- ]?stack|software|sde|platform|applied|cloud|web)\b.*\b(engineer|developer)\b'
    - '\b(django|flask|python)\b.*\b(engineer|developer|backend|full[- ]?stack)\b'
    - '\b(backend|back-end|full[- ]?stack)\b.*\b(engineer|developer)\b'
    - '\bsoftware (development )?engineer\b'
    - '\b(graduate|associate|junior|entry|student|trainee|apprentice)\b'
    - '\bintern(ship)?\b'
  exclude:
    - '\b(senior|sr\.?|staff|principal|lead|head|director|manager|vp|architect)\b'
    - '\b(sales|marketing|recruit|account|legal|finance|hr|people|designer|support|creative|communications?|content|operations?|growth|brand)\b'
    - '\b(ios|android|embedded|firmware|hardware|mechanical|security)\b'

locations:
  include: [india, hyderabad, bengaluru, bangalore, pune, chennai, mumbai, gurugram, gurgaon, noida, delhi, ncr]
  remote_ok: true          # remote roles are kept unless limited to another region (US-only, EU-only...)

max_years_required: 1      # all jobs must only require 0-1 years of experience
max_age_days: 21           # skip postings older than this (when the board says)
min_score: 40              # 0-100, see README
max_notify_per_run: 12     # first run may find hundreds; the rest arrive on later runs

# Used for the match score.
skills: [Python, Django, Flask, FastAPI, REST, API, SQL, PostgreSQL, MySQL, Docker, AWS, Linux, CI/CD,
         LLM, RAG, machine learning, Qdrant, vLLM, PyTorch, Transformers, embeddings, Generative AI, WebRTC, MongoDB]
skills_for_full_score: 5
entry_level_words: ['\bgraduate\b', '\bentry[- ]level\b', '\bjunior\b', '\bintern', '\b0-1 years?\b',
                    '\bnew grad', '\bfresher', '\bearly[- ]career\b', '\b(0|1)\+? years?\b',
                    '\b0 to 1 years?\b', '\bno experience\b']
preferred_title_words: ['\b(python|django|flask|backend|full[- ]?stack|software|sde|ai|ml|llm|machine learning)\b']

# How to treat each job that passes every filter.
apply:
  auto_apply: false        # true = try to fill the form with Playwright (see README, "Auto-apply")
  submit: false            # only when auto_apply is true: false fills the form and stops (dry run)
  answers:                 # used to fill forms
