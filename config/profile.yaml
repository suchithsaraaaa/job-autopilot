# What you are looking for. Edit freely.

# Regexes matched against the job TITLE. A job must match `include` and not `exclude`.
titles:
  include:
    - '\b(ai|ml|machine learning|llm|nlp|data)\b.*\b(engineer|developer|scientist)\b'
    - '\b(python|backend|back-end|full[- ]?stack|software|sde|platform|applied)\b.*\b(engineer|developer)\b'
    - '\bsoftware (development )?engineer\b'
    - '\b(graduate|associate|junior|entry)\b'
    - '\bintern(ship)?\b'
  exclude:
    - '\b(senior|sr\.?|staff|principal|lead|head|director|manager|vp|architect)\b'
    - '\b(sales|marketing|recruit|account|legal|finance|hr|designer|support)\b'
    - '\b(ios|android|embedded|firmware|hardware|mechanical|devops|sre|security)\b'

locations:
  include: [india, hyderabad, bengaluru, bangalore, pune, chennai, mumbai, gurugram, gurgaon, noida, delhi]
  remote_ok: true          # remote roles are kept unless limited to another region (US-only, EU-only...)

max_years_required: 2      # skip postings that ask for more than this many years
max_age_days: 21           # skip postings older than this (when the board says)
min_score: 40              # 0-100, see README
max_notify_per_run: 12     # first run may find hundreds; the rest arrive on later runs

# Used for the match score.
skills: [Python, Django, Flask, FastAPI, REST, API, SQL, LLM, RAG, NLP, PyTorch, Transformers,
         Docker, AWS, Kubernetes, PostgreSQL, Qdrant, vLLM, embeddings, machine learning, Kotlin, WebRTC, Generative AI, Linux, CI/CD]
skills_for_full_score: 5
entry_level_words: ['\bgraduate\b', '\bentry[- ]level\b', '\bjunior\b', '\bintern', '\b0-2 years\b',
                    '\bnew grad', '\bfresher', '\bearly[- ]career\b', '\b(0|1|2)\+? years?\b']
preferred_title_words: ['\b(ai|ml|llm|machine learning)\b', '\bpython\b', '\bbackend\b']

# How to treat each job that passes every filter.
apply:
  auto_apply: false        # true = try to fill the form with Playwright (see README, "Auto-apply")
  submit: false            # only when auto_apply is true: false fills the form and stops (dry run)
  answers:                 # used to fill forms
