name: job-search

on:
  schedule:
    - cron: "17 */3 * * *"      # every 3 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print matches only; send nothing, remember nothing"
        type: boolean
        default: false

permissions:
  contents: write                # to commit data/state.json (which jobs were already sent)

concurrency: job-search          # never two runs at once

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Optional auto-apply deps
        run: |
          if grep -Eq '^\s*auto_apply:\s*true' config/profile.yaml; then
            pip install -r requirements-apply.txt && playwright install --with-deps chromium
          fi
      - name: Search, tailor, notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROFILE_EMAIL: ${{ secrets.PROFILE_EMAIL }}
          PROFILE_PHONE: ${{ secrets.PROFILE_PHONE }}
        run: python -m jobautopilot run ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Remember what was sent
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "job-autopilot"
          git config user.email "job-autopilot@users.noreply.github.com"
          if [ -f data/state.json ]; then
            git add data/state.json
            git diff --cached --quiet || (git commit -m "Update seen jobs" && git push)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: tailored-resumes, path: out/, retention-days: 14, if-no-files-found: ignore }
